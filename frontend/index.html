<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penilaian Kode Otomatis dengan Gemini RAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .card { background-color: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); border: 1px solid #e5e7eb; }
        textarea { min-height: 200px; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900">Penilaian Kode Otomatis (RAG)</h1>
            <p class="text-slate-600 mt-2">Umpan Balik Cerdas Berbasis Konteks Soal</p>
        </header>

        <main>
            <div class="card p-6 mb-8">
                <h2 class="text-2xl font-semibold mb-4 border-b pb-3">Input Penilaian</h2>
                
                <div class="mb-4">
                    <label for="problemSelector" class="block text-sm font-medium text-slate-700 mb-1">Pilih Soal Pemrograman</label>
                    <select id="problemSelector" class="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-sky-500 focus:border-sky-500 bg-white">
                        <option>Memuat daftar soal...</option>
                    </select>
                </div>

                <div>
                    <label for="studentCode" class="block text-sm font-medium text-slate-700 mb-1">Kode Jawaban Siswa (C++)</label>
                    <textarea id="studentCode" class="w-full p-2 border border-slate-300 rounded-md font-mono text-sm bg-slate-50 focus:ring-2 focus:ring-sky-500 focus:border-sky-500" placeholder="#include <iostream> ..."></textarea>
                </div>

                <div class="mt-6 text-center">
                    <button id="assessButton" class="bg-sky-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition-colors duration-300 disabled:bg-slate-400 disabled:cursor-not-allowed" disabled>
                        Nilai Kode
                    </button>
                </div>
            </div>

            <div id="resultCard" class="card p-6 hidden">
                <h2 class="text-2xl font-semibold mb-4 border-b pb-3">Hasil Penilaian</h2>
                
                <div id="loading" class="text-center py-8 hidden">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-sky-600"></div>
                    <p class="mt-4 text-slate-600">Sedang menganalisis kode dengan RAG...</p>
                </div>
                
                <div id="error" class="text-red-600 bg-red-100 p-4 rounded-md hidden"></div>
                
                <div id="result" class="space-y-4"></div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
